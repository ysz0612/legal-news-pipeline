name: legal-rss-kafka

services:
  kafka:
    profiles: ["pipeline"]
    image: apache/kafka:4.1.2
    container_name: law-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: law-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: law_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      TZ: Asia/Seoul

    ports:
      - "55432:5432"

    volumes:
      - law_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d law_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    profiles: ["pipeline"]
    build:
      context: ./airflow
    container_name: law-airflow-init
    user: '0:0'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow_home/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__SECRET_KEY: law-airflow-local-secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: law_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '1234'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
    volumes:
      - .:/opt/law_project
      - airflow_home:/opt/airflow/airflow_home
      - airflow_logs:/opt/airflow/logs
    command: >-
      bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Law --lastname Admin --role Admin --email admin@example.local || true)"

  airflow-webserver:
    profiles: ["pipeline"]
    build:
      context: ./airflow
    container_name: law-airflow-webserver
    user: '0:0'
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow_home/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__SECRET_KEY: law-airflow-local-secret
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'False'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
    volumes:
      - .:/opt/law_project
      - ./airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow/airflow_home
      - airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    profiles: ["pipeline"]
    build:
      context: ./airflow
    container_name: law-airflow-scheduler
    user: '0:0'
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow_home/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__SECRET_KEY: law-airflow-local-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
    volumes:
      - .:/opt/law_project
      - ./airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow/airflow_home
      - airflow_logs:/opt/airflow/logs
    command: scheduler
  neo4j:
    image: neo4j:5.26
    container_name: law-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - law_neo4j_data:/data
      - law_neo4j_logs:/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  kafka_data:
  law_postgres_data:
  airflow_home:
  airflow_logs:
  law_neo4j_data:
  law_neo4j_logs:
