[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "confluent-kafka==2.6.1",
    "openai>=1.0.0",
    "torch==2.14.0",
    "sentence-transformers>=5.0.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "neo4j>=6.3.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
