services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-news-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_news}
      POSTGRES_USER: ${POSTGRES_USER:-legal_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_news_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
      args:
        ELASTIC_VERSION: 8.17.0
    image: legal-news-elasticsearch:8.17.0-nori
    container_name: legal-news-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
